<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Weather</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      margin: 0;
      padding: 2rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .tile {
      background: #1a1d24;
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .tile .label { font-size: 0.75rem; color: #9098a8; text-transform: uppercase; }
    .tile .value { font-size: 1.5rem; font-weight: 600; margin-top: 0.25rem; }
    #updated { color: #9098a8; font-size: 0.85rem; margin-bottom: 2rem; }
    .controls { display: flex; gap: 0.75rem; margin-bottom: 1rem; align-items: center; }
    select, button {
      background: #1a1d24;
      color: #e6e6e6;
      border: 1px solid #2a2e38;
      border-radius: 0.375rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.9rem;
    }
    button.active { background: #3b82f6; border-color: #3b82f6; }
    .chart-wrap { background: #1a1d24; border-radius: 0.5rem; padding: 1rem; }
  </style>
</head>
<body>
  <h1>Home Weather</h1>
  <div id="updated">Loading…</div>
  <div class="tiles" id="tiles"></div>

  <div class="controls">
    <select id="variable"></select>
    <button data-hours="24">24h</button>
    <button data-hours="72" class="active">3d</button>
    <button data-hours="168">7d</button>
  </div>
  <div class="chart-wrap">
    <canvas id="chart" height="90"></canvas>
  </div>

  <script>
    const VARIABLES = [
      ["temperature_2m", "Temperature", "°C"],
      ["relative_humidity_2m", "Humidity", "%"],
      ["precipitation", "Precipitation", "mm"],
      ["wind_speed_10m", "Wind speed", "km/h"],
      ["shortwave_radiation", "Solar radiation", "W/m²"],
      ["cloud_cover", "Cloud cover", "%"],
      ["surface_pressure", "Pressure", "hPa"],
    ];

    const tilesEl = document.getElementById("tiles");
    const updatedEl = document.getElementById("updated");
    const variableSelect = document.getElementById("variable");
    const hoursButtons = document.querySelectorAll("button[data-hours]");

    for (const [key, label] of VARIABLES) {
      const option = document.createElement("option");
      option.value = key;
      option.textContent = label;
      variableSelect.appendChild(option);
    }

    let chart = null;
    let selectedHours = 72;

    async function loadCurrent() {
      const response = await fetch("/api/current");
      if (!response.ok) {
        updatedEl.textContent = "No data yet";
        return;
      }
      const data = await response.json();
      updatedEl.textContent = "Last updated " + new Date(data.timestamp).toLocaleString();

      tilesEl.innerHTML = "";
      for (const [key, label, unit] of VARIABLES) {
        if (!(key in data.values)) continue;
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.innerHTML =
          '<div class="label">' + label + '</div>' +
          '<div class="value">' + data.values[key].toFixed(1) + " " + unit + '</div>';
        tilesEl.appendChild(tile);
      }
    }

    async function loadSeries() {
      const variable = variableSelect.value;
      const response = await fetch("/api/series?variable=" + variable + "&hours=" + selectedHours);
      const points = await response.json();

      const labels = points.map(p => new Date(p.time).toLocaleString());
      const values = points.map(p => p.value);
      const [, label] = VARIABLES.find(([key]) => key === variable);

      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label,
            data: values,
            borderColor: "#3b82f6",
            backgroundColor: "rgba(59, 130, 246, 0.15)",
            fill: true,
            tension: 0.2,
            pointRadius: 0,
          }],
        },
        options: {
          scales: {
            x: { ticks: { color: "#9098a8", maxTicksLimit: 8 }, grid: { color: "#2a2e38" } },
            y: { ticks: { color: "#9098a8" }, grid: { color: "#2a2e38" } },
          },
          plugins: { legend: { labels: { color: "#e6e6e6" } } },
        },
      });
    }

    variableSelect.addEventListener("change", loadSeries);
    for (const button of hoursButtons) {
      button.addEventListener("click", () => {
        hoursButtons.forEach(b => b.classList.remove("active"));
        button.classList.add("active");
        selectedHours = Number(button.dataset.hours);
        loadSeries();
      });
    }

    loadCurrent();
    loadSeries();
  </script>
</body>
</html>
