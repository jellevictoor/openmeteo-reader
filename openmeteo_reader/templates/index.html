<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Weather — Forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    :root {
      --paper: #f5f3ee;
      --card: #fffefb;
      --ink: #1f2733;
      --ink-soft: #6b7280;
      --slate: #4a6274;
      --brass: #b8863b;
      --rain: #35577a;
      --rain-soft: rgba(53, 87, 122, 0.22);
      --sun: #c1502e;
      --rule: #ded8c8;
      --highlight: #ece6d4;
    }
    * { box-sizing: border-box; }
    html { overflow-x: hidden; }
    body {
      font-family: "Archivo", sans-serif;
      background: var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 2.5rem 2rem 4rem;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    .mono { font-family: "IBM Plex Mono", monospace; }
    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 1rem 0;
    }
    .eyebrow a { color: inherit; }

    .hero {
      display: flex;
      align-items: flex-end;
      gap: 2rem;
      flex-wrap: wrap;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 1.75rem;
    }
    .hero-reading { display: flex; align-items: center; gap: 0.75rem; }
    .hero-icon { font-size: 2.75rem; line-height: 1; }
    .hero-temp { font-size: 3.75rem; font-weight: 500; line-height: 1; }
    .hero-temp .deg { font-size: 2rem; color: var(--ink-soft); }
    .hero-stats {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      padding-bottom: 0.4rem;
    }
    .hero-stat {
      border-left: 1px solid var(--rule);
      padding-left: 1.25rem;
    }
    .hero-stat:first-child { border-left: none; padding-left: 0; }
    .hero-stat .label {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 0.15rem;
    }
    .hero-stat .value { font-size: 0.9rem; font-weight: 500; }
    #heroUpdated { color: var(--ink-soft); font-size: 0.8rem; margin-top: -1.25rem; margin-bottom: 1.75rem; }

    .week {
      display: flex;
      gap: 0;
      overflow-x: auto;
      border: 1px solid var(--rule);
      border-radius: 0.6rem;
      background: var(--card);
      margin-bottom: 1.75rem;
    }
    .day-tab {
      flex: 1 0 100px;
      padding: 0.85rem 0.6rem;
      text-align: center;
      background: none;
      border: none;
      border-right: 1px solid var(--rule);
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
    }
    .day-tab:last-child { border-right: none; }
    .day-tab:hover { background: var(--paper); }
    .day-tab.active { background: var(--highlight); }
    .day-tab .dow {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .day-tab .date { font-size: 0.7rem; color: var(--ink-soft); margin-bottom: 0.3rem; }
    .day-tab .range { font-size: 0.78rem; }
    .day-tab .range .hi { font-weight: 600; }
    .day-tab .range .lo { color: var(--ink-soft); }
    .day-tab .wind { font-size: 0.7rem; color: var(--brass); margin-top: 0.2rem; }
    .day-tab .precip { font-size: 0.7rem; color: var(--rain); margin-top: 0.2rem; }
    .day-tab .today-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--brass); display: inline-block; margin-left: 0.3rem;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 0.6rem;
      padding: 1.25rem 1.5rem 1.5rem;
    }
    .panel-head { margin-bottom: 1rem; }
    .chart-wrap { max-height: 380px; }
    .mini-charts { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 1.25rem; }
    .mini-chart { flex: 1 1 200px; }
    .mini-chart-canvas { height: 60px; position: relative; }
    .mini-chart-label {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 0.35rem 0;
    }

    :focus-visible { outline: 2px solid var(--slate); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    @media (max-width: 600px) {
      body { padding: 1.25rem 1rem 2.5rem; }
      .hero { gap: 1rem; padding-bottom: 1.1rem; margin-bottom: 1.25rem; }
      .hero-icon { font-size: 2.1rem; }
      .hero-temp { font-size: 2.75rem; }
      .hero-temp .deg { font-size: 1.4rem; }
      .hero-stats { gap: 1rem 1.25rem; }
      /* A left divider only reads as "separator" on one unbroken row - once
         hero-stats wraps to multiple lines on a narrow screen, every wrapped
         line's first item would show a stray leading bar. Gap alone separates
         items fine here. */
      .hero-stat { border-left: none; padding-left: 0; }
      #heroUpdated { margin-top: -0.75rem; margin-bottom: 1.25rem; }
      .week { margin-bottom: 1.25rem; }
      .day-tab { flex-basis: 84px; padding: 0.65rem 0.4rem; }
      .panel { padding: 1rem; }
      .chart-wrap { max-height: 280px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">
      Home station forecast &middot; 50.995&deg;N 3.213&deg;E &middot;
      <a href="/history">History &rarr;</a>
    </p>

    <section class="hero">
      <div class="hero-reading">
        <span class="hero-icon" id="heroIcon">–</span>
        <span class="hero-temp mono" id="heroTemp">–<span class="deg">°C</span></span>
      </div>
      <div class="hero-stats" id="heroStats"></div>
    </section>
    <p id="heroUpdated">Loading…</p>

    <div class="week" id="week"></div>

    <section class="panel">
      <div class="panel-head">
        <p class="eyebrow" id="chartDayLabel" style="margin:0;">–</p>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" height="120"></canvas>
      </div>
      <div class="mini-charts">
        <div class="mini-chart">
          <p class="mini-chart-label">Wind</p>
          <div class="mini-chart-canvas"><canvas id="windChart"></canvas></div>
        </div>
        <div class="mini-chart">
          <p class="mini-chart-label">Solar radiation</p>
          <div class="mini-chart-canvas"><canvas id="radiationChart"></canvas></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    Chart.register(ChartDataLabels);

    const HORIZON_DAYS = 8;
    const COMPASS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE",
      "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];

    function compassDirection(degrees) {
      return COMPASS[Math.round(degrees / 22.5) % 16];
    }

    function weatherIcon(code, isDay) {
      if (code === 0) return isDay ? "☀️" : "🌙";
      if (code <= 2) return isDay ? "🌤️" : "☁️";
      if (code === 3) return "☁️";
      if (code === 45 || code === 48) return "🌫️";
      if (code >= 51 && code <= 57) return "🌦️";
      if (code >= 61 && code <= 67) return "🌧️";
      if (code >= 71 && code <= 77) return "❄️";
      if (code === 80 || code === 81 || code === 82) return "🌧️";
      if (code === 85 || code === 86) return "🌨️";
      if (code >= 95) return "⛈️";
      return "🌡️";
    }

    function dayKey(isoTime) { return isoTime.slice(0, 10); }

    function formatDayLabel(key) {
      const d = new Date(key + "T00:00:00Z");
      return d.toLocaleDateString(undefined, {
        weekday: "long", month: "short", day: "numeric", timeZone: "UTC",
      });
    }

    // Separate weekday/date formatters, rather than splitting formatDayLabel's
    // combined string on ", " - not every locale inserts that comma (e.g.
    // en-GB renders "Sunday 23 Aug"), which left the date row blank.
    function formatDayOfWeek(key) {
      const d = new Date(key + "T00:00:00Z");
      return d.toLocaleDateString(undefined, { weekday: "long", timeZone: "UTC" });
    }

    function formatDateShort(key) {
      const d = new Date(key + "T00:00:00Z");
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
    }

    function sparklinePath(values, width, height, pad) {
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      const stepX = (width - pad * 2) / (values.length - 1 || 1);
      return values.map((v, i) => {
        const x = pad + i * stepX;
        const y = pad + (1 - (v - min) / span) * (height - pad * 2);
        return (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
      }).join(" ");
    }

    const heroIconEl = document.getElementById("heroIcon");
    const heroTempEl = document.getElementById("heroTemp");
    const heroStatsEl = document.getElementById("heroStats");
    const heroUpdatedEl = document.getElementById("heroUpdated");
    const weekEl = document.getElementById("week");
    const chartDayLabelEl = document.getElementById("chartDayLabel");

    async function loadCurrent() {
      const response = await fetch("/api/current");
      if (!response.ok) {
        heroUpdatedEl.textContent = "No current reading yet";
        return;
      }
      const data = await response.json();
      const v = data.values;

      heroUpdatedEl.textContent = "As of " + new Date(data.timestamp).toLocaleString();
      heroIconEl.textContent = weatherIcon(v.weather_code, v.is_day !== 0);
      heroTempEl.innerHTML = (v.temperature_2m !== undefined ? v.temperature_2m.toFixed(1) : "–") + '<span class="deg">°C</span>';

      const stats = [];
      if (v.apparent_temperature !== undefined) stats.push(["Feels like", v.apparent_temperature.toFixed(1) + "°C"]);
      if (v.wind_speed_10m !== undefined) {
        const dir = v.wind_direction_10m !== undefined ? " " + compassDirection(v.wind_direction_10m) : "";
        stats.push(["Wind", v.wind_speed_10m.toFixed(1) + " km/h" + dir]);
      }
      if (v.relative_humidity_2m !== undefined) stats.push(["Humidity", v.relative_humidity_2m.toFixed(0) + "%"]);
      if (v.surface_pressure !== undefined) stats.push(["Pressure", v.surface_pressure.toFixed(0) + " hPa"]);
      heroStatsEl.innerHTML = stats.map(([label, value]) =>
        '<div class="hero-stat"><div class="label">' + label + '</div><div class="value">' + value + "</div></div>"
      ).join("");
    }

    // Appended once the forecast/actuals series are loaded and merged, since
    // it needs precipTotalForDay() - loadCurrent() only has the single latest
    // reading, not the day's running total.
    function renderHeroPrecip() {
      const todayKey = availableDayKeys[0];
      if (!todayKey) return;
      const soFar = precipActualSoFar(todayKey);
      const expected = precipTotalForDay(todayKey, todayKey);

      const precipStat = document.createElement("div");
      precipStat.className = "hero-stat";
      precipStat.innerHTML = '<div class="label">Precip</div><div class="value">' + soFar.toFixed(1) + " of " + expected.toFixed(1) + " mm</div>";
      heroStatsEl.appendChild(precipStat);
    }

    let tempSeries = [];      // [{time, min, median, max}]
    let precipSeries = [];    // [{time, min, median, max}] - hourly, for the chart
    let precipTotalSeries = []; // [{time, min, median, max}] - daily running total, for the day cards
    let windSeries = [];      // [{time, min, median, max}]
    let radiationSeries = []; // [{time, min, median, max}]
    let availableDayKeys = [];
    let selectedDayIndex = 0; // 0 = today
    let chart = null;
    let windChart = null;
    let radiationChart = null;

    async function loadSeries(variable) {
      const response = await fetch("/api/forecast/series?variable=" + variable + "&days=" + HORIZON_DAYS);
      if (!response.ok) return [];
      return response.json();
    }

    // The actuals bucket, for hours of *today* that have already happened - the
    // forecast bucket only ever holds what was predicted, not what was observed.
    async function loadActual(variable) {
      const response = await fetch("/api/series?variable=" + variable + "&hours=30");
      if (!response.ok) return [];
      return response.json();
    }

    function pointsForDay(series, dayKeyValue) {
      return series.filter((p) => dayKey(p.time) === dayKeyValue);
    }

    // Overwrites series points with the actual reading wherever one was recorded
    // for that hour, so elapsed hours read as "what happened", not "what was
    // forecast" - only hours still in the future keep the forecast min/median/max
    // spread. Mutates in place: both the day cards and the hourly chart read
    // from these same arrays.
    function spliceActuals(series, actualPoints) {
      const actualByTime = new Map(actualPoints.map((p) => [p.time, p.value]));
      for (const point of series) {
        const actual = actualByTime.get(point.time);
        if (actual !== undefined) {
          point.min = actual;
          point.median = actual;
          point.max = actual;
        }
      }
    }

    function dayTotal(series, dayKeyValue) {
      const medians = pointsForDay(series, dayKeyValue)
        .map((p) => p.median)
        .filter((v) => v !== null && v !== undefined);
      return medians.length ? Math.max(...medians) : 0;
    }

    // Sum of the (actual, once spliced) hourly precipitation for today's hours
    // that have already happened - what's actually fallen, not forecast.
    function precipActualSoFar(dayKeyValue) {
      const nowMs = Date.now();
      return pointsForDay(precipSeries, dayKeyValue)
        .filter((p) => new Date(p.time).getTime() <= nowMs)
        .reduce((sum, p) => sum + (p.median ?? 0), 0);
    }

    // Today's total mixes what's already known with what's still forecast: the
    // actual so far, plus only the *remaining* forecast total for the rest of
    // the day - not the whole day's forecast total, which would double count
    // the elapsed hours, and not a sum of their hourly medians, which is
    // exactly the statistic dayTotal()'s cumulative series exists to avoid.
    function precipTotalForDay(dayKeyValue, todayKey) {
      if (dayKeyValue !== todayKey) return dayTotal(precipTotalSeries, dayKeyValue);

      const nowMs = Date.now();
      const totals = pointsForDay(precipTotalSeries, dayKeyValue)
        .filter((p) => p.median !== null && p.median !== undefined);
      const elapsedTotals = totals.filter((p) => new Date(p.time).getTime() <= nowMs);
      const totalAtNow = elapsedTotals.length ? elapsedTotals[elapsedTotals.length - 1].median : 0;
      const totalAtEnd = totals.length ? totals[totals.length - 1].median : 0;
      const forecastRemaining = Math.max(0, totalAtEnd - totalAtNow);

      return precipActualSoFar(dayKeyValue) + forecastRemaining;
    }

    function renderWeek() {
      const todayKey = availableDayKeys[0];

      weekEl.innerHTML = "";
      availableDayKeys.forEach((key, index) => {
        const dayTemps = pointsForDay(tempSeries, key);
        const dayWind = pointsForDay(windSeries, key);
        const medians = dayTemps.map((p) => p.median).filter((v) => v !== null && v !== undefined);
        const hi = medians.length ? Math.max(...medians) : null;
        const lo = medians.length ? Math.min(...medians) : null;
        const path = medians.length > 1 ? sparklinePath(medians, 92, 26, 4) : "";
        const precipTotal = precipTotalForDay(key, todayKey);
        const windMedians = dayWind.map((p) => p.median).filter((v) => v !== null && v !== undefined);
        const windMax = windMedians.length ? Math.max(...windMedians) : null;

        const button = document.createElement("button");
        button.className = "day-tab" + (index === selectedDayIndex ? " active" : "");
        button.innerHTML =
          '<div class="dow">' + (index === 0 ? "Today" : formatDayOfWeek(key).slice(0, 3)) +
          (key === todayKey ? '<span class="today-dot"></span>' : "") + "</div>" +
          '<div class="date">' + formatDateShort(key) + "</div>" +
          '<svg width="92" height="26" viewBox="0 0 92 26" style="display:block;margin:0.5rem auto 0.3rem;">' +
          '<path d="' + path + '" fill="none" stroke="#4a6274" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>' +
          "</svg>" +
          '<div class="range mono">' +
          (hi !== null ? '<span class="hi">' + hi.toFixed(0) + "°</span> " : "") +
          (lo !== null ? '<span class="lo">' + lo.toFixed(0) + "°</span>" : "") +
          "</div>" +
          '<div class="precip mono">' + precipTotal.toFixed(1) + " mm</div>" +
          (windMax !== null ? '<div class="wind mono">' + windMax.toFixed(0) + " km/h</div>" : "");
        button.addEventListener("click", () => {
          selectedDayIndex = index;
          renderWeek();
          renderChart();
        });
        weekEl.appendChild(button);
      });
    }

    // Where "now" falls between two hourly points, as a fractional index into
    // the day's labels - null if the selected day isn't today, or now is
    // outside its range. Used to draw the actual/forecast boundary on the
    // chart, so it doesn't just look like a chart with no explanation for why
    // the earlier hours are flat lines instead of a spread band.
    function nowPosition(dayKeyValue, todayKey, dayPoints) {
      if (dayKeyValue !== todayKey || dayPoints.length < 2) return null;
      const nowMs = Date.now();
      const times = dayPoints.map((p) => new Date(p.time).getTime());
      if (nowMs < times[0] || nowMs > times[times.length - 1]) return null;

      let index = 0;
      while (index < times.length - 1 && times[index + 1] <= nowMs) index++;
      if (index >= times.length - 1) return { index, fraction: 0 };
      const span = times[index + 1] - times[index];
      return { index, fraction: span > 0 ? (nowMs - times[index]) / span : 0 };
    }

    function nowLinePlugin(position) {
      return {
        id: "nowLine",
        afterDraw(chartInstance) {
          if (!position) return;
          const scale = chartInstance.scales.x;
          const x0 = scale.getPixelForValue(position.index);
          const x1 = scale.getPixelForValue(Math.min(position.index + 1, scale.getLabels().length - 1));
          const x = x0 + (x1 - x0) * position.fraction;
          const { top, bottom } = chartInstance.chartArea;
          const ctx = chartInstance.ctx;
          ctx.save();
          ctx.strokeStyle = "#b8863b";
          ctx.setLineDash([3, 3]);
          ctx.lineWidth = 1.25;
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x, bottom);
          ctx.stroke();
          ctx.fillStyle = "#b8863b";
          ctx.font = "10px Archivo, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("now", x, top - 4);
          ctx.restore();
        },
      };
    }

    function renderChart() {
      const dayKeyValue = availableDayKeys[selectedDayIndex];
      chartDayLabelEl.textContent = "Hourly forecast · " + (dayKeyValue ? formatDayLabel(dayKeyValue) : "–");

      const tempDay = pointsForDay(tempSeries, dayKeyValue);
      const precipDay = pointsForDay(precipSeries, dayKeyValue);
      const labels = tempDay.map((p) => new Date(p.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
      const nowMarker = nowPosition(dayKeyValue, availableDayKeys[0], tempDay);

      const datasets = [
        {
          label: "Temperature min",
          data: tempDay.map((p) => p.min),
          yAxisID: "y",
          borderColor: "transparent",
          backgroundColor: "transparent",
          pointRadius: 0,
          fill: false,
          order: 4,
          datalabels: { display: false },
        },
        {
          label: "Temperature range",
          data: tempDay.map((p) => p.max),
          yAxisID: "y",
          borderColor: "transparent",
          backgroundColor: "rgba(74, 98, 116, 0.16)",
          pointRadius: 0,
          fill: "-1",
          order: 3,
          datalabels: { display: false },
        },
        {
          // No per-point labels - 24 printed values fighting the line, band,
          // and bars was the single biggest source of clutter here, and the
          // tooltip (hover/tap) already gives the exact reading on demand.
          label: "Temperature",
          data: tempDay.map((p) => p.median),
          yAxisID: "y",
          borderColor: "#4a6274",
          backgroundColor: "#4a6274",
          pointRadius: 3,
          pointBackgroundColor: "#4a6274",
          pointHoverRadius: 5,
          fill: false,
          tension: 0.3,
          order: 1,
          datalabels: { display: false },
        },
        {
          label: "Precipitation min",
          data: precipDay.map((p) => p.min),
          yAxisID: "y1",
          type: "line",
          borderColor: "transparent",
          backgroundColor: "transparent",
          pointRadius: 0,
          fill: false,
          order: 6,
          datalabels: { display: false },
        },
        {
          label: "Precipitation range",
          data: precipDay.map((p) => p.max),
          yAxisID: "y1",
          type: "line",
          borderColor: "transparent",
          backgroundColor: "rgba(53, 87, 122, 0.18)",
          pointRadius: 0,
          fill: "-1",
          order: 5,
          datalabels: { display: false },
        },
        {
          label: "Precipitation",
          data: precipDay.map((p) => p.median),
          yAxisID: "y1",
          type: "bar",
          backgroundColor: "rgba(53, 87, 122, 0.55)",
          order: 2,
          datalabels: { display: false },
        },
      ];

      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: { labels, datasets },
        plugins: [nowLinePlugin(nowMarker)],
        options: {
          interaction: { mode: "index", intersect: false },
          scales: {
            x: { ticks: { color: "#6b7280", maxTicksLimit: 12 }, grid: { color: "#ded8c8" } },
            y: {
              beginAtZero: true,
              position: "left",
              ticks: { color: "#4a6274" },
              grid: { color: "#ded8c8" },
              title: { display: true, text: "°C", color: "#4a6274" },
            },
            y1: {
              beginAtZero: true,
              position: "right",
              ticks: { color: "#35577a" },
              grid: { display: false },
              suggestedMax: 5,
              title: { display: true, text: "mm", color: "#35577a" },
            },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              filter: (item) => !item.dataset.label.includes("min") && !item.dataset.label.includes("range"),
              callbacks: {
                label: (ctx) => {
                  const units = { y: "°C", y1: "mm" };
                  const unit = units[ctx.dataset.yAxisID] || "";
                  return ctx.dataset.label + ": " + ctx.parsed.y.toFixed(1) + " " + unit;
                },
              },
            },
          },
        },
      });

      renderMiniCharts(pointsForDay(windSeries, dayKeyValue), pointsForDay(radiationSeries, dayKeyValue));
    }

    // Wind and radiation don't earn axis-parity with temperature/precipitation
    // (the day cards already show wind max; radiation has no other home) - a
    // small single-series sparkline each, not a third and fourth line crammed
    // onto hidden axes nobody could calibrate.
    function miniChartOptions(unit, yScale) {
      return {
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          x: { display: false },
          y: Object.assign({ ticks: { color: "#6b7280", font: { size: 9 }, maxTicksLimit: 3 }, grid: { color: "#ded8c8" } }, yScale),
        },
        plugins: {
          legend: { display: false },
          datalabels: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => ctx.parsed.y.toFixed(1) + " " + unit,
            },
          },
        },
      };
    }

    function renderMiniCharts(windDay, radiationDay) {
      if (windChart) windChart.destroy();
      windChart = new Chart(document.getElementById("windChart"), {
        type: "line",
        data: {
          labels: windDay.map((p) => p.time),
          datasets: [{
            data: windDay.map((p) => p.median),
            borderColor: "#b8863b",
            backgroundColor: "#b8863b",
            pointRadius: 0,
            fill: false,
            tension: 0.3,
          }],
        },
        options: miniChartOptions("km/h", { beginAtZero: true }),
      });

      if (radiationChart) radiationChart.destroy();
      radiationChart = new Chart(document.getElementById("radiationChart"), {
        type: "line",
        data: {
          labels: radiationDay.map((p) => p.time),
          datasets: [{
            data: radiationDay.map((p) => p.median),
            borderColor: "rgba(193, 80, 46, 0.75)",
            backgroundColor: "rgba(193, 80, 46, 0.75)",
            pointRadius: 0,
            fill: false,
            tension: 0.3,
          }],
        },
        // Fixed 0-1000 W/m2 rather than per-day auto-scaling, so intensity is
        // comparable across days - a hazy day's line sits visibly lower than a
        // clear day's, instead of both being stretched to fill the axis.
        options: miniChartOptions("W/m²", { min: 0, max: 1000 }),
      });
    }

    async function init() {
      const [, temp, precip, precipTotal, wind, radiation, actualTemp, actualPrecip, actualWind, actualRadiation] = await Promise.all([
        loadCurrent(),
        loadSeries("temperature_2m"),
        loadSeries("precipitation"),
        loadSeries("precipitation_total"),
        loadSeries("wind_speed_10m"),
        loadSeries("shortwave_radiation"),
        loadActual("temperature_2m"),
        loadActual("precipitation"),
        loadActual("wind_speed_10m"),
        loadActual("shortwave_radiation"),
      ]);
      tempSeries = temp;
      precipSeries = precip;
      precipTotalSeries = precipTotal;
      windSeries = wind;
      radiationSeries = radiation;

      // Today's already-elapsed hours have a real reading now - show that
      // instead of what was forecast for them before the fact.
      spliceActuals(tempSeries, actualTemp);
      spliceActuals(precipSeries, actualPrecip);
      spliceActuals(windSeries, actualWind);
      spliceActuals(radiationSeries, actualRadiation);

      const keys = new Set([...temp, ...precip, ...wind].map((p) => dayKey(p.time)));
      availableDayKeys = Array.from(keys).sort();

      renderWeek();
      renderChart();
      renderHeroPrecip();
    }

    init();
  </script>
</body>
</html>
