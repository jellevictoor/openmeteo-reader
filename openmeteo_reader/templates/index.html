<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Weather — Forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    :root {
      --paper: #f5f3ee;
      --card: #fffefb;
      --ink: #1f2733;
      --ink-soft: #6b7280;
      --slate: #4a6274;
      --brass: #b8863b;
      --rain: #35577a;
      --rain-soft: rgba(53, 87, 122, 0.22);
      --rule: #ded8c8;
      --highlight: #ece6d4;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Archivo", sans-serif;
      background: var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 2.5rem 2rem 4rem;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    .mono { font-family: "IBM Plex Mono", monospace; }
    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 1rem 0;
    }
    .eyebrow a { color: inherit; }

    .hero {
      display: flex;
      align-items: flex-end;
      gap: 2rem;
      flex-wrap: wrap;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 1.75rem;
    }
    .hero-reading { display: flex; align-items: center; gap: 0.75rem; }
    .hero-icon { font-size: 2.75rem; line-height: 1; }
    .hero-temp { font-size: 3.75rem; font-weight: 500; line-height: 1; }
    .hero-temp .deg { font-size: 2rem; color: var(--ink-soft); }
    .hero-stats {
      display: flex;
      gap: 1.75rem;
      flex-wrap: wrap;
      padding-bottom: 0.4rem;
    }
    .hero-stat .label {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 0.15rem;
    }
    .hero-stat .value { font-size: 1rem; font-weight: 500; }
    #heroUpdated { color: var(--ink-soft); font-size: 0.8rem; margin-top: -1.25rem; margin-bottom: 1.75rem; }

    .week {
      display: flex;
      gap: 0;
      overflow-x: auto;
      border: 1px solid var(--rule);
      border-radius: 0.6rem;
      background: var(--card);
      margin-bottom: 1.75rem;
    }
    .day-tab {
      flex: 1 0 100px;
      padding: 0.85rem 0.6rem;
      text-align: center;
      background: none;
      border: none;
      border-right: 1px solid var(--rule);
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
    }
    .day-tab:last-child { border-right: none; }
    .day-tab:hover { background: var(--paper); }
    .day-tab.active { background: var(--highlight); }
    .day-tab .dow {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .day-tab .date { font-size: 0.7rem; color: var(--ink-soft); margin-bottom: 0.3rem; }
    .day-tab .icon { font-size: 1.3rem; margin-bottom: 0.3rem; }
    .day-tab .range { font-size: 0.78rem; }
    .day-tab .range .hi { font-weight: 600; }
    .day-tab .range .lo { color: var(--ink-soft); }
    .day-tab .wind { font-size: 0.7rem; color: var(--brass); margin-top: 0.2rem; }
    .day-tab .today-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--brass); display: inline-block; margin-left: 0.3rem;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 0.6rem;
      padding: 1.25rem 1.5rem 1.5rem;
    }
    .panel-head { margin-bottom: 1rem; }
    .chart-wrap { max-height: 380px; }
    .caption { color: var(--ink-soft); font-size: 0.8rem; margin-top: 0.75rem; }

    :focus-visible { outline: 2px solid var(--slate); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">
      Home station forecast &middot; 50.995&deg;N 3.213&deg;E &middot;
      <a href="/history">History &rarr;</a>
    </p>

    <section class="hero">
      <div class="hero-reading">
        <span class="hero-icon" id="heroIcon">–</span>
        <span class="hero-temp mono" id="heroTemp">–<span class="deg">°C</span></span>
      </div>
      <div class="hero-stats" id="heroStats"></div>
    </section>
    <p id="heroUpdated">Loading…</p>

    <div class="week" id="week"></div>

    <section class="panel">
      <div class="panel-head">
        <p class="eyebrow" id="chartDayLabel" style="margin:0;">–</p>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" height="120"></canvas>
      </div>
      <p class="caption">
        Shaded bands show the spread across DWD ICON's 40 ensemble members - the
        range of what could plausibly happen, not a single fixed prediction. Wind
        speed (dashed) has no band shown, to keep the chart readable.
      </p>
    </section>
  </div>

  <script>
    Chart.register(ChartDataLabels);

    const HORIZON_DAYS = 8;
    const RAIN_ICON_THRESHOLD_MM = 0.2;
    const COMPASS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE",
      "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];

    function compassDirection(degrees) {
      return COMPASS[Math.round(degrees / 22.5) % 16];
    }

    function weatherIcon(code, isDay) {
      if (code === 0) return isDay ? "☀️" : "🌙";
      if (code <= 2) return isDay ? "🌤️" : "☁️";
      if (code === 3) return "☁️";
      if (code === 45 || code === 48) return "🌫️";
      if (code >= 51 && code <= 57) return "🌦️";
      if (code >= 61 && code <= 67) return "🌧️";
      if (code >= 71 && code <= 77) return "❄️";
      if (code === 80 || code === 81 || code === 82) return "🌧️";
      if (code === 85 || code === 86) return "🌨️";
      if (code >= 95) return "⛈️";
      return "🌡️";
    }

    function dayKey(isoTime) { return isoTime.slice(0, 10); }

    function formatDayLabel(key) {
      const d = new Date(key + "T00:00:00Z");
      return d.toLocaleDateString(undefined, {
        weekday: "long", month: "short", day: "numeric", timeZone: "UTC",
      });
    }

    function sparklinePath(values, width, height, pad) {
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      const stepX = (width - pad * 2) / (values.length - 1 || 1);
      return values.map((v, i) => {
        const x = pad + i * stepX;
        const y = pad + (1 - (v - min) / span) * (height - pad * 2);
        return (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
      }).join(" ");
    }

    const heroIconEl = document.getElementById("heroIcon");
    const heroTempEl = document.getElementById("heroTemp");
    const heroStatsEl = document.getElementById("heroStats");
    const heroUpdatedEl = document.getElementById("heroUpdated");
    const weekEl = document.getElementById("week");
    const chartDayLabelEl = document.getElementById("chartDayLabel");

    async function loadCurrent() {
      const response = await fetch("/api/current");
      if (!response.ok) {
        heroUpdatedEl.textContent = "No current reading yet";
        return;
      }
      const data = await response.json();
      const v = data.values;

      heroUpdatedEl.textContent = "As of " + new Date(data.timestamp).toLocaleString();
      heroIconEl.textContent = weatherIcon(v.weather_code, v.is_day !== 0);
      heroTempEl.innerHTML = (v.temperature_2m !== undefined ? v.temperature_2m.toFixed(1) : "–") + '<span class="deg">°C</span>';

      const stats = [];
      if (v.apparent_temperature !== undefined) stats.push(["Feels like", v.apparent_temperature.toFixed(1) + "°C"]);
      if (v.wind_speed_10m !== undefined) {
        const dir = v.wind_direction_10m !== undefined ? " " + compassDirection(v.wind_direction_10m) : "";
        stats.push(["Wind", v.wind_speed_10m.toFixed(1) + " km/h" + dir]);
      }
      if (v.relative_humidity_2m !== undefined) stats.push(["Humidity", v.relative_humidity_2m.toFixed(0) + "%"]);
      if (v.surface_pressure !== undefined) stats.push(["Pressure", v.surface_pressure.toFixed(0) + " hPa"]);
      heroStatsEl.innerHTML = stats.map(([label, value]) =>
        '<div class="hero-stat"><div class="label">' + label + '</div><div class="value">' + value + "</div></div>"
      ).join("");
    }

    let tempSeries = [];    // [{time, min, median, max}]
    let precipSeries = [];  // [{time, min, median, max}]
    let windSeries = [];    // [{time, min, median, max}]
    let availableDayKeys = [];
    let selectedDayIndex = 0; // 0 = today
    let chart = null;

    async function loadSeries(variable) {
      const response = await fetch("/api/forecast/series?variable=" + variable + "&days=" + HORIZON_DAYS);
      if (!response.ok) return [];
      return response.json();
    }

    function pointsForDay(series, dayKeyValue) {
      return series.filter((p) => dayKey(p.time) === dayKeyValue);
    }

    function renderWeek() {
      const todayKey = availableDayKeys[0];

      weekEl.innerHTML = "";
      availableDayKeys.forEach((key, index) => {
        const dayTemps = pointsForDay(tempSeries, key);
        const dayPrecip = pointsForDay(precipSeries, key);
        const dayWind = pointsForDay(windSeries, key);
        const medians = dayTemps.map((p) => p.median).filter((v) => v !== null && v !== undefined);
        const hi = medians.length ? Math.max(...medians) : null;
        const lo = medians.length ? Math.min(...medians) : null;
        const path = medians.length > 1 ? sparklinePath(medians, 92, 26, 4) : "";
        const rainExpected = dayPrecip.some((p) => (p.median ?? 0) >= RAIN_ICON_THRESHOLD_MM);
        const windMedians = dayWind.map((p) => p.median).filter((v) => v !== null && v !== undefined);
        const windMax = windMedians.length ? Math.max(...windMedians) : null;

        const button = document.createElement("button");
        button.className = "day-tab" + (index === selectedDayIndex ? " active" : "");
        button.innerHTML =
          '<div class="dow">' + (index === 0 ? "Today" : formatDayLabel(key).split(",")[0].slice(0, 3)) +
          (key === todayKey ? '<span class="today-dot"></span>' : "") + "</div>" +
          '<div class="date">' + formatDayLabel(key).split(", ")[1] + "</div>" +
          '<div class="icon">' + (rainExpected ? "🌦️" : "☀️") + "</div>" +
          '<svg width="92" height="26" viewBox="0 0 92 26" style="display:block;margin:0 auto 0.3rem;">' +
          '<path d="' + path + '" fill="none" stroke="#4a6274" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>' +
          "</svg>" +
          '<div class="range mono">' +
          (hi !== null ? '<span class="hi">' + hi.toFixed(0) + "°</span> " : "") +
          (lo !== null ? '<span class="lo">' + lo.toFixed(0) + "°</span>" : "") +
          "</div>" +
          (windMax !== null ? '<div class="wind mono">' + windMax.toFixed(0) + " km/h</div>" : "");
        button.addEventListener("click", () => {
          selectedDayIndex = index;
          renderWeek();
          renderChart();
        });
        weekEl.appendChild(button);
      });
    }

    function renderChart() {
      const dayKeyValue = availableDayKeys[selectedDayIndex];
      chartDayLabelEl.textContent = "Hourly forecast · " + (dayKeyValue ? formatDayLabel(dayKeyValue) : "–");

      const tempDay = pointsForDay(tempSeries, dayKeyValue);
      const precipDay = pointsForDay(precipSeries, dayKeyValue);
      const windDay = pointsForDay(windSeries, dayKeyValue);
      const labels = tempDay.map((p) => new Date(p.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));

      const datasets = [
        {
          label: "Temperature min",
          data: tempDay.map((p) => p.min),
          yAxisID: "y",
          borderColor: "transparent",
          backgroundColor: "transparent",
          pointRadius: 0,
          fill: false,
          order: 4,
          datalabels: { display: false },
        },
        {
          label: "Temperature range",
          data: tempDay.map((p) => p.max),
          yAxisID: "y",
          borderColor: "transparent",
          backgroundColor: "rgba(74, 98, 116, 0.16)",
          pointRadius: 0,
          fill: "-1",
          order: 3,
          datalabels: { display: false },
        },
        {
          label: "Temperature",
          data: tempDay.map((p) => p.median),
          yAxisID: "y",
          borderColor: "#4a6274",
          backgroundColor: "#4a6274",
          pointRadius: 3,
          pointBackgroundColor: "#4a6274",
          pointHoverRadius: 5,
          fill: false,
          tension: 0.3,
          order: 1,
          datalabels: {
            color: "#6b7280",
            font: { size: 10 },
            align: "top",
            formatter: (v) => (v === null || v === undefined ? "" : v.toFixed(1) + "°"),
          },
        },
        {
          label: "Precipitation min",
          data: precipDay.map((p) => p.min),
          yAxisID: "y1",
          type: "line",
          borderColor: "transparent",
          backgroundColor: "transparent",
          pointRadius: 0,
          fill: false,
          order: 6,
          datalabels: { display: false },
        },
        {
          label: "Precipitation range",
          data: precipDay.map((p) => p.max),
          yAxisID: "y1",
          type: "line",
          borderColor: "transparent",
          backgroundColor: "rgba(53, 87, 122, 0.18)",
          pointRadius: 0,
          fill: "-1",
          order: 5,
          datalabels: { display: false },
        },
        {
          label: "Precipitation",
          data: precipDay.map((p) => p.median),
          yAxisID: "y1",
          type: "bar",
          backgroundColor: "rgba(53, 87, 122, 0.55)",
          order: 2,
          datalabels: { display: false },
        },
        {
          // No band for wind - just the median, on its own hidden-axis scale so
          // it doesn't compete visually with temperature's or precipitation's.
          label: "Wind speed",
          data: windDay.map((p) => p.median),
          yAxisID: "y2",
          borderColor: "#b8863b",
          backgroundColor: "#b8863b",
          borderDash: [4, 3],
          pointRadius: 0,
          fill: false,
          tension: 0.3,
          order: 7,
          datalabels: { display: false },
        },
      ];

      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: { labels, datasets },
        options: {
          interaction: { mode: "index", intersect: false },
          scales: {
            x: { ticks: { color: "#6b7280", maxTicksLimit: 12 }, grid: { color: "#ded8c8" } },
            y: {
              beginAtZero: true,
              position: "left",
              ticks: { color: "#4a6274" },
              grid: { color: "#ded8c8" },
              title: { display: true, text: "°C", color: "#4a6274" },
            },
            y1: {
              beginAtZero: true,
              position: "right",
              ticks: { color: "#35577a" },
              grid: { display: false },
              suggestedMax: 5,
              title: { display: true, text: "mm", color: "#35577a" },
            },
            y2: { beginAtZero: true, display: false },
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              filter: (item) => !item.dataset.label.includes("min") && !item.dataset.label.includes("range"),
              callbacks: {
                label: (ctx) => {
                  const units = { y: "°C", y1: "mm", y2: "km/h" };
                  const unit = units[ctx.dataset.yAxisID] || "";
                  return ctx.dataset.label + ": " + ctx.parsed.y.toFixed(1) + " " + unit;
                },
              },
            },
          },
        },
      });
    }

    async function init() {
      const [, temp, precip, wind] = await Promise.all([
        loadCurrent(),
        loadSeries("temperature_2m"),
        loadSeries("precipitation"),
        loadSeries("wind_speed_10m"),
      ]);
      tempSeries = temp;
      precipSeries = precip;
      windSeries = wind;

      const keys = new Set([...temp, ...precip, ...wind].map((p) => dayKey(p.time)));
      availableDayKeys = Array.from(keys).sort();

      renderWeek();
      renderChart();
    }

    init();
  </script>
</body>
</html>
