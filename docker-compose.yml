services:
  api:
    image: ghcr.io/jellevictoor/openmeteo-reader-api:latest
    container_name: openmeteo-reader-api
    environment:
      - INFLUX_URL=${INFLUX_URL:-http://influxdb:8086}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-weather}
    restart: unless-stopped
    networks:
      - jelle_default
    labels:
      traefik.enable: "true"
      traefik.http.routers.openmeteo-reader.rule: "Host(`weather.victoor.io`)"
      traefik.http.routers.openmeteo-reader.entrypoints: "websecure"
      traefik.http.routers.openmeteo-reader.tls: "true"
      traefik.http.routers.openmeteo-reader.tls.certresolver: "cloudflare"
      traefik.http.services.openmeteo-reader.loadbalancer.server.port: "8000"

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: openmeteo-reader-scheduler
    command: daemon --docker
    volumes:
      # Rootless docker on this host - matches Traefik's own socket mount.
      - /run/user/1000/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    labels:
      ofelia.enabled: "true"
      # ofelia's cron has a leading seconds field: "sec min hour day month weekday".
      # This runs at minute 0 of every hour - a plain 5-field "0 * * * *" gets
      # misread as seconds=0,minutes=* and fires every minute instead.
      ofelia.job-run.openmeteo-import.schedule: "0 0 * * * *"
      ofelia.job-run.openmeteo-import.image: "ghcr.io/jellevictoor/openmeteo-reader:latest"
      ofelia.job-run.openmeteo-import.network: "jelle_default"
      ofelia.job-run.openmeteo-import.command: >-
        main
        --influx-url ${INFLUX_URL:-http://influxdb:8086}
        --influx-token ${INFLUX_TOKEN}
        --influx-org ${INFLUX_ORG}
        --influx-bucket ${INFLUX_BUCKET:-weather}

networks:
  jelle_default:
    external: true
