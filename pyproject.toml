[project]
name = "openmeteo-reader"
version = "0.1.0"
description = "Open-Meteo weather ingestion into InfluxDB, with a small viewer website"
authors = [{name = "Jelle Victoor", email = "jelle@victoor.io"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "influxdb-client>=1.35.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
openmeteo-reader = "openmeteo_reader.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff>=0.13.3",
    "pre-commit>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
